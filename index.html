<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-Up Form</title>
</head>
<body>
    <div class="leaf-container">
        <div class="odin-logo-container">
            <img class="odin-logo-img" src="img/odin-lined.png" alt="picture of Odin logo">
            <div>Odin</div>
        </div>
        <div class="credit-line">
            <p>Photo by <span>Haile West</span> on <span>Unsplash</span></p>
        </div>
    </div>
    <div class="form-container">
        <div class="form-heading-text text-margin">
            This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
            </br>Sign up <em>now</em> to get started.
        </div>
        <div class="form-heading-text text-margin">
            You <em>know</em> you want to.
        </div>

        <form id="theForm">
            <fieldset>
                <legend>Let's do this!</legend>
                <div class="form-items-container">
                    <div class="form-items-1">
                        <label for="first-name">FIRST NAME</label>
                        <input id="first-name" name="first-name" type="text">

                        <label for="last-name">LAST NAME</label>
                        <input id="last-name" name="last-name" type="text">

                        <label for="email">EMAIL</label>
                        <input id="email" name="email" type="email">
                    </div>
                    <div class="form-items-2">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input id="phone-number" name="phone-number" type="text">

                        <label for="password">PASSWORD</label>
                        <input id="password" name="password" type="password">

                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input id="confirm-password" name="confirm-password" type="password">
                    </div>
                </div>
            </fieldset>
        </form>
        <div class="form-button text-margin">
            <button type="submit" form="theForm">Create Account</button>
        </div>
        <div class="text-margin">
            Already have an account? <span>Log in</span>
        </div>
    </div>
</body>
</html>
